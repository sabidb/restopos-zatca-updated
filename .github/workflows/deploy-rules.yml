name: Deploy Security Rules

# firestore.rules guards live tills and storage.rules guards every client's
# filed CR and VAT certificates. This runs both test suites first and refuses
# to deploy if anything fails, so a bad rule can't reach production.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules test dependencies
        run: npm install
        working-directory: rules-test

      - name: Test Firestore rules against the emulator
        run: npm test
        working-directory: rules-test

      - name: Test Storage rules against the emulator
        run: npm run test:storage
        working-directory: rules-test

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules
        # Rules ONLY — never indexes. An index deploy reconciles the whole set
        # and deletes anything the file does not list, so it has its own
        # workflow (deploy-indexes.yml) with its own decision to make.
        run: npx firebase-tools@13 deploy --only firestore:rules,storage --project restopos-db
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
