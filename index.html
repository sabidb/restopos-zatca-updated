<!DOCTYPE html>
<!--
  The app's default language is English (getLang() falls back to "en"), so the
  document must start that way too. This said lang="ar" dir="rtl", which meant
  every screen rendered before React set its own direction — registration,
  licence activation, the terms gate, login — laid English out right-to-left.
  Punctuation jumped to the wrong side and labels sat against the wrong edge,
  on precisely the screens a prospect sees first.

  App.jsx keeps this in step with the chosen language, so Arabic still gets a
  properly right-to-left document.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A6B4A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RestoPOS" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- SEO -->
    <title>RestoPOS — ZATCA Phase 2</title>
    <meta name="description" content="Professional Restaurant POS — ZATCA Phase 2 Compliant · نظام نقاط البيع للمطاعم" />

    <!-- Prevent caching old versions -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
