name: Temporary dependency lock refresh
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/temporary-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lock-and-verify:
    if: github.head_ref == 'fix/dependency-security-pos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply compatible audit fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "chore: refresh lockfile for patched Vite toolchain"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Capture dependency audit
        run: npm audit --json > audit-report.json || true
      - name: Fail on remaining high or critical advisories
        run: node -e "const a=require('./audit-report.json');const v=a.vulnerabilities||{};const n=Object.values(v).filter(x=>['high','critical'].includes(x.severity)).length;console.log('High/Critical advisory packages:',n);if(n)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
